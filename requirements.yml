---
# Ansible collection requirements
#
# Install before first run:
#   ansible-galaxy collection install -r requirements.yml
#
# The amazon.aws collection provides:
#   - amazon.aws.aws_secret lookup plugin  (fetch secrets at play time)
#   - amazon.aws.* modules                 (general AWS automation)

collections:
  - name: amazon.aws
    version: ">=8.0.0"
