[defaults]
inventory           = inventories/production/hosts
roles_path          = roles
collections_paths   = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = yaml
forks               = 5
interpreter_python  = /usr/bin/python3
# No vault needed, secrets come from AWS Secrets Manager

[privilege_escalation]
# become is set per-task, not globally
become          = False
become_method   = sudo
become_ask_pass = False

[ssh_connection]
# SSH key is fetched from Secrets Manager at runtime and written to a temp file
ssh_args    = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
pipelining  = True
